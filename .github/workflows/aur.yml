# Publish AUR packages (aether-rescue-git, aether-rescue-bin) on tag push or manual dispatch.
# Runs inside archlinux:base-devel so makepkg is available — CI both verifies the PKGBUILDs
# build cleanly and pushes the exact .SRCINFO produced by makepkg, so the AUR package page
# always shows the real version.
#
# Requires secrets (see packaging/aur/README.md):
#   AUR_SSH_PRIVATE_KEY — dedicated AUR SSH private key (passphrase-less; multiple keys supported)
#   AUR_KNOWN_HOSTS     — optional pinned host key (ssh-keyscan output); falls back to ssh-keyscan
#   AUR_GIT_USER        — committer identity on the AUR commit (default: Fgaoxing <Fgaoxing0206@163.com>)
name: publish-aur

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  aur:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm git cmake python zstd openssh

      - name: Clone repo (need git history for `git describe`)
        run: |
          git config --global --add safe.directory '*'
          rm -rf /__w/Aether/Aether/* /__w/Aether/Aether/.??*
          git clone --tags https://github.com/Fgaoxing/Aether.git /__w/Aether/Aether
          cd /__w/Aether/Aether && git describe --tags --long --match 'v*'

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_USER: ${{ secrets.AUR_GIT_USER }}
        run: |
          set -e
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "secret AUR_SSH_PRIVATE_KEY is not set"; exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/id_aur\n  User aur\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # openssh resolves ~ via passwd, not $HOME carriage — mirror files for both roots
          PWH="$(python3 -c 'import pwd;print(pwd.getpwuid(0).pw_dir)')"
          if [ "$PWH" != "$HOME" ]; then
            mkdir -p "$PWH/.ssh"
            chmod 700 "$PWH/.ssh"
            cp ~/.ssh/id_aur ~/.ssh/config "$PWH/.ssh/"
            chmod 600 "$PWH/.ssh/id_aur" "$PWH/.ssh/config"
          fi
          echo "GIT_SSH_COMMAND=ssh -F $PWH/.ssh/config" >> "$GITHUB_ENV"
          git config --global user.name "Fgaoxing"
          git config --global user.email "${AUR_GIT_USER:-Fgaoxing0206@163.com}"

      - name: Compute versions
        run: |
          vtag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            vtag="${GITHUB_REF_NAME#v}"
          else
            vtag="$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')"
          fi
          [ -n "$vtag" ] || { echo "no v* tag found"; exit 1; }
          echo "VTAG=$vtag" >> "$GITHUB_ENV"
          git fetch --tags --force
          desc=$(git describe --tags --long --match 'v*')
          pkgver_git=$(printf '%s' "$desc" | sed -E 's/^v//; s/-([0-9]+)-g/.r\1.g/; s/-/./g')
          echo "PKGVER_GIT=$pkgver_git" >> "$GITHUB_ENV"
          echo "git pkgver:  $pkgver_git"
          echo "bin vtag:    $vtag"

      - name: Create builder user (makepkg refuses root)
        run: |
          useradd -m -s /bin/bash builder
          chown -R builder:builder /__w/Aether/Aether

      - name: Verify and publish aether-rescue-git
        run: |
          set -e
          su -s /bin/bash builder -c '
            set -e
            cd /__w/Aether/Aether/packaging/aur/aether-rescue-git
            sed -i "s/^pkgver=.*/pkgver='"$PKGVER_GIT"'/" PKGBUILD
            makepkg --printsrcinfo > .SRCINFO
            makepkg -s --noconfirm
            rm -f *.pkg.tar.zst *-debug.pkg.tar.zst
          '

      - name: Verify and publish aether-rescue-bin
        run: |
          set -e
          su -s /bin/bash builder -c '
            set -e
            cd /__w/Aether/Aether/packaging/aur/aether-rescue-bin
            sed -i "s/^pkgver=.*/pkgver='"$VTAG"'/" PKGBUILD
            makepkg --printsrcinfo > .SRCINFO
            makepkg -s --noconfirm
            rm -f *.pkg.tar.zst *-debug.pkg.tar.zst
          '

      - name: Push aether-rescue-git
        run: PKGVER="$PKGVER_GIT" python3 packaging/aur/aur_tool.py push aether-rescue-git

      - name: Push aether-rescue-bin
        run: PKGVER="$VTAG" python3 packaging/aur/aur_tool.py push aether-rescue-bin
