# CI: build x86_64 (libc + nolibc + tests), cross-build i386 / aarch64 / riscv64 (nolibc static).
# Pushing a tag v* additionally creates a GitHub Release with the static binaries + SHA256SUMS.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang gcc binutils
      - name: libc build + ctest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
      - name: nolibc static build
        run: |
          cmake -S . -B build-nolibc -DUSE_HOST_LIBC=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-nolibc -j"$(nproc)"
          file build-nolibc/aether
      - uses: actions/upload-artifact@v4
        with:
          name: aether-x86_64-nolibc
          path: build-nolibc/aether

  i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake binutils gcc-multilib
      - name: nolibc i386 cross build (gcc -m32)
        run: |
          CC=gcc cmake -S . -B build-i386 -DUSE_HOST_LIBC=OFF -DAETHER_ARCH=i386 \
            -DCMAKE_C_FLAGS="-m32 -fomit-frame-pointer" -DCMAKE_ASM_FLAGS="-m32" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-i386 -j"$(nproc)"
          file build-i386/aether
      - uses: actions/upload-artifact@v4
        with:
          name: aether-i386-nolibc
          path: build-i386/aether

  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: nolibc arm cross build
        run: |
          CC=arm-linux-gnueabihf-gcc cmake -S . -B build-arm -DUSE_HOST_LIBC=OFF \
            -DAETHER_ARCH=arm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm -j"$(nproc)"
          file build-arm/aether
      - uses: actions/upload-artifact@v4
        with:
          name: aether-arm-nolibc
          path: build-arm/aether

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: nolibc aarch64 cross build
        run: |
          CC=aarch64-linux-gnu-gcc cmake -S . -B build-aarch64 -DUSE_HOST_LIBC=OFF \
            -DAETHER_ARCH=aarch64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-aarch64 -j"$(nproc)"
          file build-aarch64/aether
      - uses: actions/upload-artifact@v4
        with:
          name: aether-aarch64-nolibc
          path: build-aarch64/aether

  riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user python3
      - name: riscv64 libc build and tests under QEMU
        run: |
          cmake -S . -B build-riscv64-libc -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=riscv64 \
            -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc \
            '-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-riscv64;-L;/usr/riscv64-linux-gnu'
          cmake --build build-riscv64-libc -j"$(nproc)"
          ctest --test-dir build-riscv64-libc --output-on-failure
      - name: nolibc riscv64 cross build
        run: |
          CC=riscv64-linux-gnu-gcc cmake -S . -B build-riscv64 -DUSE_HOST_LIBC=OFF \
            -DAETHER_ARCH=riscv64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-riscv64 -j"$(nproc)"
          file build-riscv64/aether
      - name: riscv64 nolibc shell smoke test
        run: python3 tools/pty_test.py /usr/bin/qemu-riscv64 "$PWD/build-riscv64/aether"
      - uses: actions/upload-artifact@v4
        with:
          name: aether-riscv64-nolibc
          path: build-riscv64/aether

  loongarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-loongarch64-linux-gnu binutils-loongarch64-linux-gnu
      - name: nolibc loongarch64 cross build
        run: |
          CC=loongarch64-linux-gnu-gcc cmake -S . -B build-loongarch64 -DUSE_HOST_LIBC=OFF \
            -DAETHER_ARCH=loongarch64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-loongarch64 -j"$(nproc)"
          file build-loongarch64/aether
      - uses: actions/upload-artifact@v4
        with:
          name: aether-loongarch64-nolibc
          path: build-loongarch64/aether

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [x86_64, i386, arm, aarch64, riscv64, loongarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten + checksums
        run: |
          cd dist
          mv aether-x86_64-nolibc/aether tmp-x86_64 && rmdir aether-x86_64-nolibc && mv tmp-x86_64 aether-x86_64-nolibc
          mv aether-i386-nolibc/aether tmp-i386 && rmdir aether-i386-nolibc && mv tmp-i386 aether-i386-nolibc
          mv aether-arm-nolibc/aether tmp-arm && rmdir aether-arm-nolibc && mv tmp-arm aether-arm-nolibc
          mv aether-aarch64-nolibc/aether tmp-aarch64 && rmdir aether-aarch64-nolibc && mv tmp-aarch64 aether-aarch64-nolibc
          mv aether-riscv64-nolibc/aether tmp-riscv64 && rmdir aether-riscv64-nolibc && mv tmp-riscv64 aether-riscv64-nolibc
          mv aether-loongarch64-nolibc/aether tmp-loongarch64 && rmdir aether-loongarch64-nolibc && mv tmp-loongarch64 aether-loongarch64-nolibc
          sha256sum aether-* > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
